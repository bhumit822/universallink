<!DOCTYPE html>

    <title>TopShelf App</title>

    <meta property="og:title" content="topshelf">
    <meta property="og:description" content="Discover your next favorite beauty product with TopShelf, the must-have social media-based app that connects you to the latest and greatest in beauty through real-time reviews and recommendations from friends and influencers.">
    <meta property="og:image" content="https://firebasestorage.googleapis.com/v0/b/topshelf-d392c.appspot.com/o/logo.png?alt=media">

    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">
    <script>
        function redirectToStore() {
            // Detect the user's platform
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(userAgent)) {
                // Redirect to Google Play Store
                window.location.href = 'https://play.google.com/store/apps/details?id=com.main.topshelf';
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // Redirect to Apple App Store
                window.location.href = 'https://apps.apple.com/de/app/topshelf/id6504464782?l=en-GB';
            } else {
                // Default action (optional)
                console.log('Platform not detected or not supported.');
            }
        }

        // Execute the function when the page loads
        window.onload = redirectToStore;

    </script>
</head>
